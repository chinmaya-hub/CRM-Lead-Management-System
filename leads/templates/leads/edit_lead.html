<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Lead | CRM System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
        }

        .edit-card {
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            color: #243b64;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="edit-card">

            <h2 class="page-title mb-2">Edit Lead</h2>

            <p class="text-muted mb-4">
                Update the information for {{ lead.name }}.
            </p>

            <form method="POST">
                {% csrf_token %}

                {{ form.non_field_errors }}

                {% for field in form %}
                <div class="mb-3">

                    <label for="{{ field.id_for_label }}" class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.help_text %}
                    <div class="form-text">
                        {{ field.help_text }}
                    </div>
                    {% endif %}

                    {% for error in field.errors %}
                    <div class="text-danger small">
                        {{ error }}
                    </div>
                    {% endfor %}

                </div>
                {% endfor %}

                <div class="d-flex gap-2 mt-4">

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="{% url 'lead_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>

                </div>
            </form>

        </div>
    </div>

</body>

</html>
